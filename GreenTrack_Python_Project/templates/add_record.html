{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <p class="eyebrow">DAILY ENTRY</p>
    <h1>Add a sustainability record</h1>
    <p class="muted">Enter your estimated daily usage. Use 0 if you do not have a value.</p>
    <form method="POST">
        <label>Date</label>
        <input type="date" name="record_date" value="{{ today }}" required>

        <label>Electricity used (kWh)</label>
        <input type="number" name="electricity" min="0" step="0.1" placeholder="Example: 3.5" required>

        <label>Water used (litres)</label>
        <input type="number" name="water" min="0" step="0.1" placeholder="Example: 120" required>

        <label>Waste generated (kg)</label>
        <input type="number" name="waste" min="0" step="0.1" placeholder="Example: 0.8" required>

        <label>One eco-friendly action (optional)</label>
        <textarea name="eco_action" rows="3" placeholder="Example: Used a reusable bottle"></textarea>

        <button type="submit">Save record</button>
    </form>
</div>
{% endblock %}
